name: AI PR Agent
on:
  pull_request:
    # 'ready_for_review' is good if you use Draft PRs at ArrisOne
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    # This line prevents the bot from responding to other bots
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          # Your Gemini Key from Google AI Studio
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The Model
          CONFIG.MODEL: 'gemini/gemini-1.5-flash'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
