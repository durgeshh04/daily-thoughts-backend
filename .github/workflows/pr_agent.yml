name: AI PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI__API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFIG__MODEL: 'gpt-4o-mini'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          PR_REVIEWER__AUTO_REVIEW: 'true'
