name: AI PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG__MODEL: 'gemini-1.5-flash'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          PR_REVIEWER__AUTO_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: 'false'
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: 'false'
          PR_CODE_SUGGESTIONS__ENABLED: "false"
